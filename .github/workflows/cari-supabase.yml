name: Lihat Konfigurasi Supabase

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ekstrak project
        run: |
          mkdir project
          unzip flutter_ecostay_app.zip -d project

      - name: Tampilkan konfigurasi aman
        run: |
          FILE="project/flutter_ecostay_app/lib/main.dart"

          echo "===== KONFIGURASI SUPABASE ====="

          sed -n '7,13p' "$FILE" | \
          sed -E "s/(anonKey:[[:space:]]*')[^']+/\1[DISENSOR]/"

          echo ""
          echo "===== CEK ANONKEY ====="

          if grep -q "anonKey:" "$FILE"; then
            echo "anonKey ditemukan: YA"
          else
            echo "anonKey ditemukan: TIDAK"
          fi
